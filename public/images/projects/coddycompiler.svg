<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" fill="none">
  <rect width="1200" height="750" fill="#040814"/>
  
  <!-- Background Glows -->
  <circle cx="200" cy="200" r="300" fill="#0066ff" opacity="0.12" filter="blur(80px)"/>
  <circle cx="900" cy="450" r="350" fill="#00c8ff" opacity="0.15" filter="blur(90px)"/>
  
  <!-- Header elements -->
  <g transform="translate(60, 50)">
    <!-- Logo -->
    <path d="M0 20 L18 5 L28 15 L18 25 Z" fill="#0099ff"/>
    <path d="M22 20 L40 5 L50 15 L40 25 Z" fill="#00d2ff"/>
    <text x="60" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="26">CoddyCompiler</text>
  </g>

  <!-- Main Hero Text Left -->
  <text x="60" y="190" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="52">Write Code.</text>
  <text x="60" y="250" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="52">Compile.</text>
  <text x="60" y="310" fill="#00abff" font-family="system-ui, sans-serif" font-weight="800" font-size="52">See Results.</text>
  
  <text x="60" y="360" fill="#88a0c0" font-family="system-ui, sans-serif" font-size="18">Fast and simple online compiler for your favorite languages.</text>

  <!-- Mock IDE Window Right -->
  <g transform="translate(520, 110)">
    <!-- Main IDE Container -->
    <rect width="620" height="520" rx="16" fill="#091022" stroke="#0055ff" stroke-opacity="0.3" stroke-width="2"/>
    
    <!-- Top Bar -->
    <path d="M0 16 C0 7 7 0 16 0 L604 0 C613 0 620 7 620 16 L620 44 L0 44 Z" fill="#0e172a"/>
    <rect x="20" y="10" width="100" height="26" rx="6" fill="#1e293b"/>
    <text x="35" y="27" fill="#38bdf8" font-family="monospace" font-size="13">main.py</text>
    
    <!-- Run Button -->
    <rect x="510" y="8" width="90" height="28" rx="14" fill="#0088ff"/>
    <polygon points="535,16 535,28 547,22" fill="#ffffff"/>
    <text x="554" y="27" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="600" font-size="13">Run</text>

    <!-- Code Panel Left -->
    <rect x="15" y="55" width="350" height="440" rx="8" fill="#060b18"/>
    <text x="30" y="85" fill="#475569" font-family="monospace" font-size="13">1</text>
    <text x="50" y="85" fill="#64748b" font-family="monospace" font-size="13"># Welcome to CoddyCompiler</text>

    <text x="30" y="115" fill="#475569" font-family="monospace" font-size="13">2</text>
    <text x="50" y="115" fill="#38bdf8" font-family="monospace" font-size="13">print</text>
    <text x="90" y="115" fill="#e2e8f0" font-family="monospace" font-size="13">(</text>
    <text x="98" y="115" fill="#4ade80" font-family="monospace" font-size="13">"Hello, Uzbekistan!"</text>
    <text x="255" y="115" fill="#e2e8f0" font-family="monospace" font-size="13">)</text>

    <text x="30" y="155" fill="#475569" font-family="monospace" font-size="13">3</text>
    <text x="50" y="155" fill="#f472b6" font-family="monospace" font-size="13">name</text>
    <text x="90" y="155" fill="#e2e8f0" font-family="monospace" font-size="13">=</text>
    <text x="105" y="155" fill="#38bdf8" font-family="monospace" font-size="13">input</text>
    <text x="145" y="155" fill="#e2e8f0" font-family="monospace" font-size="13">(</text>
    <text x="153" y="155" fill="#4ade80" font-family="monospace" font-size="13">"What's name? "</text>
    <text x="275" y="155" fill="#e2e8f0" font-family="monospace" font-size="13">)</text>

    <text x="30" y="195" fill="#475569" font-family="monospace" font-size="13">4</text>
    <text x="50" y="195" fill="#fbbf24" font-family="monospace" font-size="13">for</text>
    <text x="80" y="195" fill="#e2e8f0" font-family="monospace" font-size="13">i</text>
    <text x="95" y="195" fill="#fbbf24" font-family="monospace" font-size="13">in</text>
    <text x="115" y="195" fill="#38bdf8" font-family="monospace" font-size="13">range</text>
    <text x="155" y="195" fill="#e2e8f0" font-family="monospace" font-size="13">(1, 6):</text>

    <text x="30" y="225" fill="#475569" font-family="monospace" font-size="13">5</text>
    <text x="70" y="225" fill="#38bdf8" font-family="monospace" font-size="13">print</text>
    <text x="110" y="225" fill="#e2e8f0" font-family="monospace" font-size="13">(f</text>
    <text x="125" y="225" fill="#4ade80" font-family="monospace" font-size="13">"{i} * 5 = {i * 5}"</text>
    <text x="270" y="225" fill="#e2e8f0" font-family="monospace" font-size="13">)</text>

    <!-- Output Panel Right -->
    <rect x="375" y="55" width="230" height="440" rx="8" fill="#0b1329"/>
    <text x="390" y="80" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Output</text>
    <line x1="375" y1="95" x2="605" y2="95" stroke="#1e293b"/>
    
    <text x="390" y="120" fill="#38bdf8" font-family="monospace" font-size="13">Hello, Uzbekistan!</text>
    <text x="390" y="145" fill="#e2e8f0" font-family="monospace" font-size="13">What's your name? </text>
    <text x="390" y="165" fill="#38bdf8" font-family="monospace" font-size="13">Arslan</text>
    <text x="390" y="190" fill="#4ade80" font-family="monospace" font-size="13">Nice to meet you, Arslan!</text>
    <text x="390" y="225" fill="#cbd5e1" font-family="monospace" font-size="12">1 * 5 = 5</text>
    <text x="390" y="245" fill="#cbd5e1" font-family="monospace" font-size="12">2 * 5 = 10</text>
    <text x="390" y="265" fill="#cbd5e1" font-family="monospace" font-size="12">3 * 5 = 15</text>
    <text x="390" y="285" fill="#cbd5e1" font-family="monospace" font-size="12">4 * 5 = 20</text>
    <text x="390" y="305" fill="#cbd5e1" font-family="monospace" font-size="12">5 * 5 = 25</text>
  </g>
</svg>
